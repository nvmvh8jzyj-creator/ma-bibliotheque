<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma Bibli">
<title>Ma Bibliothèque</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f9f6f8; --surface: #ffffff; --surface2: #f2eaf0; --text: #241628; --text2: #634d69; --text3: #9b7e9f; --border: rgba(116, 79, 140, 0.15);
  --purple-light: #8758A6; --purple-dark: #744F8C; --purple-bg: #f3ebf5;
  --green-bright: #04BF33; --green-dark: #048C26; --green-bg: #e6f8eb;
  --ochre: #D98B48; --ochre-bg: #fcf3ea;
  --warning: var(--ochre); --warning-bg: var(--ochre-bg); --danger: #c0392b; --danger-bg: #fdecea;
  --radius: 16px; --nav-h: 68px; --shadow: 0 4px 12px rgba(116, 79, 140, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #140d17; --surface: #201524; --surface2: #2e2033; --text: #f5edf7; --text2: #c5b4c9; --text3: #88748c; --border: rgba(255, 255, 255, 0.1);
    --purple-light: #a375c4; --purple-dark: #8758A6; --purple-bg: #321d3b;
    --green-bright: #2cd456; --green-dark: #04BF33; --green-bg: #11381c;
    --shadow: 0 4px 12px rgba(0,0,0,0.4);
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
.header { background: var(--surface); border-bottom: 3px solid var(--ochre); padding: 12px 16px; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-home-btn, .settings-icon-btn { background: var(--surface2); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--purple-dark); -webkit-tap-highlight-color: transparent; }
@media (prefers-color-scheme: dark) { .header-home-btn, .settings-icon-btn { color: var(--purple-light); } }
.header-home-btn svg, .settings-icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.header h1 { font-size: 20px; font-weight: 800; color: var(--purple-dark); letter-spacing: -0.5px; }
@media (prefers-color-scheme: dark) { .header h1 { color: var(--purple-light); } }
.header p { font-size: 11px; color: var(--text2); margin-top: 1px; font-weight: 500; }

.nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 60px 1fr 1fr; align-items: center; justify-items: center; z-index: 10; box-shadow: 0 -4px 16px rgba(0,0,0,0.06); }
.nav-btn { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: none; cursor: pointer; color: var(--text3); font-size: 9px; font-weight: 600; padding: 4px 0; }
.nav-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.nav-btn.active { color: var(--purple-light); }
.nav-btn-center { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--purple-dark), var(--purple-light)); color: #fff; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(116, 79, 140, 0.4); cursor: pointer; margin-top: -20px; }
.nav-btn-center svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 2.5; }

.section { display: none; padding: 16px; }
.section.visible { display: block; }

#accueil.section.visible { display: flex; flex-direction: column; height: calc(100vh - 65px - var(--nav-h) - env(safe-area-inset-bottom)); padding: 0 16px 12px 16px; overflow: hidden; position: relative; }
.hero-full-container { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 -16px; overflow: hidden; }
.hero-text-details { text-align: center; width: 100%; padding: 0 12px; }
.hero-title-main { font-size: 17px; font-weight: 800; line-height: 1.2; margin-bottom: 2px; color: var(--text); }
.hero-serie-main { font-size: 12px; font-weight: 700; color: var(--purple-light); margin-bottom: 2px; }
.hero-author-main { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 6px; }

.btn-check-done { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--green-dark); background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); color: var(--green-dark); display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; }
@media (prefers-color-scheme: dark) { .btn-check-done { border-color: var(--green-bright); color: var(--green-bright); background: rgba(0,0,0,0.35); } }
.btn-check-done svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 3; }

.bottom-shortcuts-area { flex-shrink: 0; padding-top: 8px; z-index: 2; }
.search-bar { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 15px; width: 100%; color: var(--text); box-shadow: var(--shadow); }

.segmented-control { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; margin-bottom: 10px; border: 1px solid var(--border); overflow-x: auto; }
.segment-btn { flex: 1; text-align: center; padding: 8px 6px; font-size: 11px; font-weight: 700; border: none; background: none; color: var(--text2); border-radius: 10px; cursor: pointer; white-space: nowrap; }
.segment-btn.active { background: var(--surface); color: var(--purple-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
@media (prefers-color-scheme: dark) { .segment-btn.active { color: var(--purple-light); } }

.filter-row-compact { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.filter-select { width: 100%; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--purple-dark); box-shadow: var(--shadow); }
@media (prefers-color-scheme: dark) { .filter-select { color: var(--purple-light); } }

.quick-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { white-space: nowrap; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; }
.chip.active { background: var(--purple-dark); color: #fff; border-color: var(--purple-dark); }

.book-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.book-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
.badges { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
.badge-format { background: var(--surface2); color: var(--purple-dark); border: 1px solid var(--border); }
@media (prefers-color-scheme: dark) { .badge-format { color: var(--purple-light); } }

.card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.btn { font-size: 11px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 600; }
.btn-action-done { border-color: rgba(4, 140, 38, 0.3); color: var(--green-dark); }
.btn-action-read { border-color: rgba(116, 79, 140, 0.3); color: var(--purple-dark); background: var(--surface2); }
.btn-accent { background: var(--purple-bg); color: var(--purple-dark); border: none; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal-card { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 420px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }

.pioche-section { display: flex; flex-direction: column; gap: 8px; }
.pioche-btn { width: 100%; padding: 12px 14px; font-size: 13px; font-weight: 700; border-radius: var(--radius); border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; text-align: left; }
.pioche-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.pioche-serie-bought { background: var(--green-dark); color: #fff; }
.pioche-new-serie-bought { background: #27ae60; color: #fff; }
.pioche-oneshot { background: var(--ochre); color: #fff; }
.pioche-wish-serie { background: var(--purple-dark); color: #fff; }
.pioche-wish-oneshot { background: var(--purple-light); color: #fff; }
.pioche-shopping-list { background: linear-gradient(135deg, var(--purple-dark), var(--purple-light)); color: #fff; font-size: 14px; padding: 14px; box-shadow: 0 4px 12px rgba(116, 79, 140, 0.3); }

.shopping-item-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.shopping-item-title { font-size: 12px; font-weight: 700; color: var(--text); }
.shopping-item-sub { font-size: 10px; color: var(--text2); }
.shopping-item-price { font-size: 12px; font-weight: 800; color: var(--green-dark); }
@media (prefers-color-scheme: dark) { .shopping-item-price { color: var(--green-bright); } }

.btn-full { width: 100%; padding: 12px; font-size: 14px; font-weight: 700; border-radius: 10px; border: none; background: var(--purple-dark); color: #fff; cursor: pointer; margin-bottom: 6px; }
.btn-secondary-full { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.form-field { margin-bottom: 10px; }
.form-field label { font-size: 11px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 3px; }
.form-field input, .form-field select { width: 100%; font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); }

.section-label { font-size: 11px; font-weight: 800; color: var(--purple-dark); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
@media (prefers-color-scheme: dark) { .section-label { color: var(--purple-light); } }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); cursor: pointer; }
.stat-num { font-size: 20px; font-weight: 800; }
.stat-label { font-size: 10px; color: var(--text2); margin-top: 2px; font-weight: 600; }
.stat-num.purple { color: var(--purple-light); }
.stat-num.accent { color: var(--ochre); }
</style>
</head>
<body>

<datalist id="auteurs-list"></datalist>

<div class="header">
  <div class="header-left">
    <button class="header-home-btn" onclick="showSection('accueil')" aria-label="Accueil">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <div>
      <h1>Ma bibliothèque</h1>
      <p id="header-count">Chargement...</p>
    </div>
  </div>
  <button class="settings-icon-btn" onclick="showSection('reglages')" aria-label="Réglages">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<!-- Modal Liste de Courses -->
<div class="modal-overlay" id="shopping-list-modal">
  <div class="modal-card" style="max-height:85vh; overflow-y:auto;">
    <p class="section-label" style="margin-bottom:4px;">🛒 Ma Liste de Courses du Mois</p>
    <div id="shopping-list-budget-info" style="font-size:12px; font-weight:700; color:var(--purple-light); margin-bottom:8px;"></div>
    
    <div style="background:var(--surface2); padding:8px 10px; border-radius:8px; margin-bottom:10px; border:1px solid var(--border);">
      <label style="display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; cursor:pointer;">
        <input type="checkbox" id="include-new-series-cb" onchange="generateMonthlyShoppingList()" style="width:auto;-webkit-appearance:checkbox;">
        <span>➕ Inclure aussi de nouvelles séries à commencer (Tome 1)</span>
      </label>
    </div>

    <div id="shopping-list-items-container"></div>
    <button class="btn-full" onclick="closeShoppingListModal()" style="margin-top:10px;">Fermer</button>
  </div>
</div>

<!-- POPUP PIOCHE -->
<div class="modal-overlay" id="pioche-modal">
  <div class="modal-card" style="text-align:center;">
    <p class="section-label" style="margin-bottom:8px;">Résultat du tirage 🎲</p>
    <div id="pioche-modal-title" style="font-size:16px; font-weight:800; margin-bottom:2px;"></div>
    <div id="pioche-modal-serie" style="font-size:12px; font-weight:700; color:var(--purple-light);"></div>
    <div id="pioche-modal-author" style="font-size:12px; color:var(--text2); margin-bottom:12px;"></div>
    <button class="btn-full" id="pioche-modal-start-btn" onclick="startReadingFromPioche()">📖 Commencer la lecture</button>
    <button class="btn-full btn-secondary-full" onclick="closePiocheModal()">Fermer</button>
  </div>
</div>

<div id="accueil" class="section visible">
  <div id="hero-reading-container" class="hero-full-container"></div>
  <div class="bottom-shortcuts-area">
    <div class="stat-grid">
      <div class="stat-card" onclick="goToPalWithChip('next_read')">
        <div class="stat-num purple">⚡</div>
        <div class="stat-label">Prochain tome à lire</div>
      </div>
      <div class="stat-card" onclick="showSection('wishlist')">
        <div class="stat-num accent">🛒</div>
        <div class="stat-label">Ma Wishlist</div>
      </div>
    </div>
  </div>
</div>

<div id="pal" class="section">
  <input class="search-bar" type="search" id="search" placeholder="Chercher titre, saga ou auteur·rice..." oninput="renderPAL()">
  <div class="segmented-control" style="margin-top:10px;">
    <button class="segment-btn active" id="seg-all" onclick="setSegmentType('all', this)">Tous</button>
    <button class="segment-btn" id="seg-serie" onclick="setSegmentType('serie', this)">📚 Séries</button>
    <button class="segment-btn" id="seg-oneshot" onclick="setSegmentType('one_shot', this)">📖 One-shots</button>
  </div>
  <div class="filter-row-compact">
    <select class="filter-select" id="main-status-filter" onchange="setMainStatusFilter(this.value)">
      <option value="all">Tous les statuts de ma PAL</option>
      <option value="en_cours">📖 En cours de lecture</option>
      <option value="a_commencer">⏳ À commencer</option>
      <option value="termine">✓ Terminés / Lus</option>
    </select>
  </div>
  <div class="quick-chips" style="margin-bottom:12px;">
    <button class="chip" id="chip-fav" onclick="toggleQuickChip('favorite', this)">❤️ Coups de cœur</button>
    <button class="chip" id="chip-next-read" onclick="toggleQuickChip('next_read', this)">⚡ Prochain à lire</button>
  </div>
  <div id="pal-list"></div>
</div>

<div id="wishlist" class="section">
  <div class="search-bar-wrap">
    <input class="search-bar" type="search" id="search-wish" placeholder="Chercher dans ma wishlist..." oninput="renderWishlist()">
  </div>
  <div class="segmented-control">
    <button class="segment-btn active" id="wish-seg-continue" onclick="setWishSegment('continue', this)">🔄 Séries à continuer</button>
    <button class="segment-btn" id="wish-seg-start" onclick="setWishSegment('start', this)">📚 Séries à commencer</button>
    <button class="segment-btn" id="wish-seg-oneshot" onclick="setWishSegment('oneshot', this)">📖 One-shots</button>
    <button class="segment-btn" id="wish-seg-publi" onclick="setWishSegment('publi', this)">⏳ À paraître</button>
  </div>
  <div id="wishlist-list"></div>
</div>

<div id="pioche" class="section">
  <p class="section-label">Générateur & Pioche</p>
  <div class="pioche-section">
    <button class="pioche-btn pioche-shopping-list" onclick="generateMonthlyShoppingList()">
      🛒 Générer ma liste de courses ce mois-ci
    </button>
    
    <p class="section-label" style="margin-top:8px; margin-bottom:2px;">Tirage aléatoire</p>
    <button class="pioche-btn pioche-serie-bought" onclick="pioche('suite_serie_possedee')">🎲 Suite de série possédée</button>
    <button class="pioche-btn pioche-new-serie-bought" onclick="pioche('commencer_nouvelle_serie_possedee')">📚 Commencer une nouvelle série possédée</button>
    <button class="pioche-btn pioche-oneshot" onclick="pioche('oneshot_possede')">📖 One-shot possédé</button>
    <button class="pioche-btn pioche-wish-serie" onclick="pioche('acheter_nouvelle_serie')">🛒 Acheter une nouvelle série (Wishlist)</button>
    <button class="pioche-btn pioche-wish-oneshot" onclick="pioche('acheter_nouveau_oneshot')">🛍️ Acheter un nouveau one-shot (Wishlist)</button>
  </div>
</div>

<div id="stats" class="section">
  <p class="section-label">Statistiques</p>
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-num purple" id="stat-read-year">0</div>
      <div class="stat-label">Livres lus</div>
    </div>
    <div class="stat-card">
      <div class="stat-num accent" id="stat-spend-year">0 €</div>
      <div class="stat-label">Dépensés</div>
    </div>
  </div>
</div>

<div id="ajouter" class="section">
  <div class="form-card">
    <p class="section-label" style="margin-bottom:8px;">Informations du livre</p>
    <div class="form-field">
      <label>Type de livre</label>
      <select id="new-type" onchange="toggleSerieFields()">
        <option value="one_shot">One-shot / Livre unique</option>
        <option value="serie">Fait partie d'une série</option>
      </select>
    </div>
    <div id="serie-fields" style="display:none; background: var(--surface2); padding: 10px; border-radius: 8px; margin-bottom: 8px;">
      <div class="form-field">
        <label>Série / Saga</label>
        <select id="select-serie-id" onchange="handleSerieSelectChange(this.value)">
          <option value="__NEW__">+ Créer une nouvelle série</option>
        </select>
      </div>
      <div id="custom-serie-wrap">
        <div class="form-field"><label>Nom de la nouvelle série</label><input type="text" id="new-serie-nom"></div>
        <div class="form-field"><label>Auteur·rice de la série</label><input type="text" id="new-serie-auteur" list="auteurs-list"></div>
        <div class="form-field"><label>Total tomes</label><input type="number" id="new-serie-total" value="4"></div>
      </div>
      <div class="form-field"><label>Numéro de ce tome</label><input type="number" id="new-tome-num" step="0.1" value="1"></div>
    </div>
    <div class="form-field"><label>Titre propre du livre *</label><input type="text" id="new-titre"></div>
    <div class="form-field" id="oneshot-author-wrap"><label>Auteur·rice</label><input type="text" id="new-auteur" list="auteurs-list"></div>
    <div class="form-field">
      <label>Format de prédilection</label>
      <select id="new-format">
        <option value="broche">Broché (Occasion ~10€)</option>
        <option value="poche">Poche (Occasion ~5€)</option>
      </select>
    </div>
    <div class="form-field">
      <label>Statut</label>
      <select id="new-statut">
        <option value="a_commencer">À commencer (Possédé)</option>
        <option value="en_cours">En cours de lecture</option>
        <option value="a_acheter">🛒 En Wishlist (À acheter)</option>
        <option value="en_attente_publi">📦 En attente de suite / publication</option>
        <option value="termine">Terminé / Lu</option>
      </select>
    </div>
    <button class="btn-full" onclick="addBook()">Ajouter à ma bibliothèque</button>
  </div>
</div>

<div id="reglages" class="section">
  <p class="section-label">Budget Mensuel</p>
  <div class="form-card">
    <div style="display: flex; gap: 8px;">
      <input type="number" id="setting-budget-limit" min="0" step="1" style="flex:1;">
      <button onclick="saveBudgetLimitSetting()" class="btn" style="background:var(--purple-dark); color:#fff;">Enregistrer</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn" id="nav-pal" onclick="showSection('pal')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Ma PAL
  </button>
  <button class="nav-btn" id="nav-wishlist" onclick="showSection('wishlist')">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Wishlist
  </button>
  <button class="nav-btn-center" onclick="showSection('ajouter')" aria-label="Ajouter">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="nav-btn" id="nav-pioche" onclick="showSection('pioche')">
    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    Pioche
  </button>
  <button class="nav-btn" id="nav-stats" onclick="showSection('stats')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Stats
  </button>
</nav>

<script>
let books = [], series = {}, depenses = [];
let segmentType = 'all', wishSegment = 'continue', mainStatusFilter = 'all', activeQuickChip = 'none';
let budgetLimit = 75;
let currentPiocheBookIdx = null;

function load() {
  try { books = JSON.parse(localStorage.getItem('pal_books') || '[]'); } catch(e) { books=[]; }
  try { series = JSON.parse(localStorage.getItem('pal_series') || '{}'); } catch(e) { series={}; }
  try { budgetLimit = parseFloat(localStorage.getItem('pal_budget_limit')) || 75; } catch(e) { budgetLimit = 75; }
  
  const limitInput = document.getElementById('setting-budget-limit');
  if (limitInput) limitInput.value = budgetLimit;

  renderAccueil();
  renderPAL(); 
  renderWishlist();
  updateAuteursDataList();
}

function save() { 
  localStorage.setItem('pal_books', JSON.stringify(books)); 
  localStorage.setItem('pal_series', JSON.stringify(series)); 
  updateAuteursDataList();
}

function updateAuteursDataList() {
  const listEl = document.getElementById('auteurs-list');
  if (!listEl) return;
  const auteursSet = new Set();
  books.forEach(b => { if (b.auteur && b.auteur.trim()) auteursSet.add(b.auteur.trim()); });
  listEl.innerHTML = Array.from(auteursSet).sort((a,b) => a.localeCompare(b, 'fr')).map(a => `<option value="${escHtml(a)}"></option>`).join('');
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
  document.getElementById(id).classList.add('visible');
  ['accueil','pal','wishlist','stats','pioche','ajouter','reglages'].forEach(s => {
    const navBtn = document.getElementById('nav-'+s);
    if (navBtn) navBtn.classList.toggle('active', s===id);
  });
  if (id === 'accueil') renderAccueil();
  else if (id === 'wishlist') renderWishlist();
  else if (id === 'ajouter') populateSerieDropdown();
  else if (id === 'stats') renderStats();
}

function setSegmentType(type, el) { segmentType = type; document.querySelectorAll('#pal .segment-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); renderPAL(); }
function setWishSegment(type, el) { wishSegment = type; document.querySelectorAll('#wishlist .segment-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); renderWishlist(); }
function setMainStatusFilter(val) { mainStatusFilter = val; renderPAL(); }
function toggleQuickChip(chip, el) { activeQuickChip = (activeQuickChip === chip) ? 'none' : chip; el.classList.toggle('active', activeQuickChip === chip); renderPAL(); }

function renderAccueil() {
  const container = document.getElementById('hero-reading-container');
  const enCoursBooks = books.filter(b => b.statut === 'en_cours');
  if (!enCoursBooks.length) {
    container.innerHTML = `<div style="text-align:center; padding: 2rem 1rem;">
      <p style="font-size:15px; font-weight:700; color:var(--text2); margin-bottom:8px;">Aucune lecture en cours !</p>
      <button class="btn btn-accent" onclick="showSection('pioche')">🎲 Piocher un livre</button>
    </div>`;
    return;
  }
  let html = `<div class="carousel-wrap"><div class="carousel-slides-container">`;
  html += enCoursBooks.map((b) => {
    const idx = books.indexOf(b);
    const s = b.serieId ? series[b.serieId] : null;
    return `<div class="carousel-slide">
      <div class="hero-reading-content-inner">
        <div class="hero-text-details">
          <div class="hero-title-main">${escHtml(b.titre)}</div>
          ${s ? `<div class="hero-serie-main">📚 ${escHtml(s.nom)} · Tome ${b.tomeNum}/${s.totalTomes}</div>` : ''}
          <div class="hero-author-main">${escHtml(b.auteur || (s ? s.auteur : ''))}</div>
          <button class="btn-check-done" onclick="markDone(${idx})"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button>
        </div>
      </div>
    </div>`;
  }).join('');
  html += `</div></div>`;
  container.innerHTML = html;
}

/* 🛒 GENERATEUR STRICT : TOME PRÉCÉDENT TERMINÉ OBLIGATOIRE + ONE-SHOTS */
function generateMonthlyShoppingList() {
  const wishBooks = books.filter(b => b.statut === 'a_acheter');
  if (!wishBooks.length) { alert("Ta Wishlist 'À acheter' est vide !"); return; }

  const includeNewSeries = document.getElementById('include-new-series-cb') ? document.getElementById('include-new-series-cb').checked : false;

  let totalEstime = 0;
  let selectedItems = [];

  // P1 : Séries dont le tome précédent (Tome-1) est TERMINÉ et le tome actuel pas encore possédé
  const wishSeries = wishBooks.filter(b => b.type === 'serie');

  for (let b of wishSeries) {
    if (!b.serieId) continue;
    
    const tomeCurrent = b.tomeNum || 1;
    
    // Vérifier si le tome précédent est TERMINÉ
    const previousTomeRead = books.some(other => 
      other.type === 'serie' && 
      other.serieId === b.serieId && 
      other.tomeNum === (tomeCurrent - 1) && 
      other.statut === 'termine'
    );

    // Vérifier si le tome actuel n'est pas DEJA possédé dans la PAL
    const alreadyInPal = books.some(other => 
      other.type === 'serie' && 
      other.serieId === b.serieId && 
      other.tomeNum === tomeCurrent && 
      other.statut !== 'a_acheter' && 
      other.statut !== 'en_attente_publi'
    );

    if (previousTomeRead && !alreadyInPal) {
      let price = b.prix > 0 ? b.prix : (b.format === 'poche' ? 5 : 10);
      if (totalEstime + price <= budgetLimit) {
        totalEstime += price;
        selectedItems.push({ book: b, estimatedPrice: price, reason: "🔄 Suite débloquée (Tome préc. lu)" });
      }
    }
  }

  // P2 : One-shots
  const oneShots = wishBooks.filter(b => b.type === 'one_shot');
  for (let b of oneShots) {
    let price = b.prix > 0 ? b.prix : (b.format === 'poche' ? 5 : 10);
    if (totalEstime + price <= budgetLimit) {
      totalEstime += price;
      selectedItems.push({ book: b, estimatedPrice: price, reason: "📖 One-shot" });
    }
  }

  // P3 : Nouvelles séries (Tome 1) SEULEMENT si coché
  if (includeNewSeries) {
    const newSeriesTome1 = wishBooks.filter(b => b.type === 'serie' && (b.tomeNum === 1 || !b.tomeNum));
    for (let b of newSeriesTome1) {
      // Vérifier si pas déjà possédé
      const inPal = books.some(other => other.type === 'serie' && other.serieId === b.serieId && other.statut !== 'a_acheter' && other.statut !== 'en_attente_publi');
      if (!inPal) {
        let price = b.prix > 0 ? b.prix : (b.format === 'poche' ? 5 : 10);
        if (totalEstime + price <= budgetLimit) {
          totalEstime += price;
          selectedItems.push({ book: b, estimatedPrice: price, reason: "📚 Nouvelle série (Tome 1)" });
        }
      }
    }
  }

  if (!selectedItems.length) { 
    alert("Aucun livre ne correspond à tes critères ce mois-ci (ex: aucun tome suivant débloqué par un tome terminé)."); 
    return; 
  }

  document.getElementById('shopping-list-budget-info').textContent = `Total estimé : ${totalEstime.toFixed(2)} € sur ${budgetLimit} € (${selectedItems.length} livre(s))`;
  const container = document.getElementById('shopping-list-items-container');
  container.innerHTML = selectedItems.map(item => {
    const b = item.book;
    const formatTxt = b.format === 'poche' ? 'Poche (~5€)' : 'Broché (~10€)';
    return `<div class="shopping-item-card">
      <div style="flex:1; min-width:0;">
        <div class="shopping-item-title">${escHtml(b.titre)}</div>
        <div class="shopping-item-sub">${item.reason} · ${formatTxt}</div>
      </div>
      <div style="text-align:right;">
        <div class="shopping-item-price">${item.estimatedPrice.toFixed(2)} €</div>
        <button class="btn" style="padding:2px 6px; font-size:9px;" onclick="window.open('https://www.vinted.fr/catalog?search_text=${encodeURIComponent(b.titre)}+livre', '_blank')">🔍 Vinted</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('shopping-list-modal').classList.add('open');
}

function closeShoppingListModal() { document.getElementById('shopping-list-modal').classList.remove('open'); }

function renderPAL() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  let ownedBooks = books.filter(b => b.statut !== 'a_acheter' && b.statut !== 'en_attente_publi');

  let filtered = ownedBooks.filter(b => {
    const s = b.serieId ? series[b.serieId] : null;
    const matchQ = b.titre.toLowerCase().includes(q) || (b.auteur||'').toLowerCase().includes(q) || (s && s.nom.toLowerCase().includes(q));
    if (q && !matchQ) return false;
    if (segmentType === 'serie' && b.type !== 'serie') return false;
    if (segmentType === 'one_shot' && b.type !== 'one_shot') return false;
    if (mainStatusFilter !== 'all' && b.statut !== mainStatusFilter) return false;
    if (activeQuickChip === 'favorite' && !b.favorite) return false;
    return true;
  });

  document.getElementById('header-count').textContent = `${ownedBooks.length} livres possédés`;
  const list = document.getElementById('pal-list');
  if (!filtered.length) { list.innerHTML='<div class="empty-state">Aucun livre trouvé</div>'; return; }

  list.innerHTML = filtered.map(b => {
    const idx = books.indexOf(b);
    return `<div class="book-card">
      <div class="book-title">${escHtml(b.titre)}</div>
      <div class="book-author">${escHtml(b.auteur || (b.serieId && series[b.serieId] ? series[b.serieId].auteur : ''))}</div>
      <div class="card-actions">
        ${b.statut === 'a_commencer' ? `<button class="btn btn-action-read" onclick="startReading(${idx})">📖 Commencer</button>` : ''}
        <button class="btn btn-action-done" onclick="markDone(${idx})">✓ Terminer</button>
      </div>
    </div>`;
  }).join('');
}

function renderWishlist() {
  const q = (document.getElementById('search-wish').value||'').toLowerCase();
  let wishBooks = books.filter(b => b.statut === 'a_acheter' || b.statut === 'en_attente_publi');

  let filtered = wishBooks.filter(b => {
    const matchQ = b.titre.toLowerCase().includes(q) || (b.auteur||'').toLowerCase().includes(q);
    if (q && !matchQ) return false;
    if (wishSegment === 'publi') return b.statut === 'en_attente_publi';
    if (wishSegment === 'oneshot') return b.type === 'one_shot';
    return true;
  });

  const list = document.getElementById('wishlist-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty-state">Wishlist vide</div>'; return; }

  list.innerHTML = filtered.map(b => {
    const idx = books.indexOf(b);
    const formatBadge = b.format === 'poche' ? 'Poche (~5€)' : 'Broché (~10€)';
    return `<div class="book-card">
      <div class="book-title">${escHtml(b.titre)}</div>
      <div class="badges"><span class="badge badge-format">${formatBadge}</span></div>
      <div class="card-actions">
        <button class="btn btn-action-done" onclick="markBought(${idx})">📦 Acheté</button>
        <button class="btn btn-accent" onclick="window.open('https://www.vinted.fr/catalog?search_text=${encodeURIComponent(b.titre)}+livre', '_blank')">🔍 Vinted</button>
      </div>
    </div>`;
  }).join('');
}

function renderStats() {
  const readBooksYear = books.filter(b => b.statut === 'termine');
  document.getElementById('stat-read-year').textContent = readBooksYear.length;
  const spend = books.reduce((s, b) => s + (b.prix || 0), 0);
  document.getElementById('stat-spend-year').textContent = spend.toFixed(2) + ' €';
}

function startReading(idx) { books[idx].statut = 'en_cours'; save(); renderAccueil(); renderPAL(); showSection('accueil'); }
function markDone(idx) { books[idx].statut = 'termine'; save(); renderAccueil(); renderPAL(); renderWishlist(); }
function markBought(idx) { books[idx].statut = 'a_commencer'; save(); renderAccueil(); renderPAL(); renderWishlist(); }

function addBook() {
  const titre = document.getElementById('new-titre').value.trim();
  if (!titre) return;
  const type = document.getElementById('new-type').value;
  const statut = document.getElementById('new-statut').value;
  const format = document.getElementById('new-format').value;
  const b = { id: 'book_' + Date.now(), titre, auteur: document.getElementById('new-auteur').value.trim(), type, statut, format, prix: 0, dateAjout: new Date().toISOString().slice(0,10) };
  books.unshift(b); save();
  document.getElementById('new-titre').value = '';
  showSection(statut === 'a_acheter' ? 'wishlist' : 'pal');
}

function populateSerieDropdown() {
  const select = document.getElementById('select-serie-id');
  if (!select) return;
  let html = '<option value="__NEW__">+ Créer une nouvelle série</option>';
  Object.keys(series).forEach(id => { html += `<option value="${id}">${escHtml(series[id].nom)}</option>`; });
  select.innerHTML = html;
}

function toggleSerieFields() { document.getElementById('serie-fields').style.display = (document.getElementById('new-type').value === 'serie') ? 'block' : 'none'; }
function handleSerieSelectChange(v) { document.getElementById('custom-serie-wrap').style.display = (v === '__NEW__') ? 'block' : 'none'; }
function saveBudgetLimitSetting() { budgetLimit = parseFloat(document.getElementById('setting-budget-limit').value) || 75; localStorage.setItem('pal_budget_limit', budgetLimit); alert('Budget mis à jour !'); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

load();
</script>
</body>
</html>
